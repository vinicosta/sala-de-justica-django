{% load i18n %}
<a href="{% url 'admin:auth_user_change' request.user.pk %}" class="flex items-center gap-3 p-3">
    <img src="https://gravatar.com/avatar/{{ gravatar_hash }}?size=80&d=initials" width="32" height="32"
        style="border-radius:50%;object-fit:cover;" alt="{{ request.user.get_full_name }}">
    <div>
        <div style="font-size:13px;font-weight:500;">{{ request.user.get_full_name }}</div>
        <div style="font-size:11px;opacity:0.6;">{{ request.user.email }}</div>
    </div>
</a>
