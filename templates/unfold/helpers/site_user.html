{% load i18n %}
<a href="{% url 'admin:auth_user_change' request.user.pk %}" class="flex items-center gap-3 p-3">
    {% if gravatar_url %}
    <img src="{{ gravatar_url }}" width="32" height="32" style="border-radius:50%;object-fit:cover;"
        alt="{{ request.user.get_full_name }}">
    {% else %}
    <div
        style="width:32px;height:32px;border-radius:50%;background:var(--un-bg-muted);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;">
        {{ request.user.get_full_name|first|default:request.user.username|first|upper }}
    </div>
    {% endif %}
    <div>
        <div style="font-size:13px;font-weight:500;">{{ request.user.get_full_name }}</div>
        <div style="font-size:11px;opacity:0.6;">{{ request.user.email }}</div>
    </div>
</a>
